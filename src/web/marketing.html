<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketingstudio</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/app.css"></head>
<body>
<div id="studio-app" class="app-shell studio" hidden>
  <aside id="studio-zijbalk" class="app-zijbalk">
    <div class="app-merk">
      <div class="app-merk-tekst">
        <a class="logo" href="/#overzicht">
          <img id="studio-logo" alt="" width="28" height="28" hidden>
          <span id="studio-merknaam"></span>
        </a>
        <small>Marketingstudio</small>
      </div>
    </div>
    <nav id="studio-nav" class="app-navigatie" aria-label="Marketingstudio"></nav>
    <div class="app-profiel">
      <div><b id="studio-naam">Beheerder</b><span>Platformadmin</span></div>
      <div class="app-profiel-links"><a href="/beheer">← Platformbeheer</a></div>
      <button id="studio-uitloggen" class="secundair" type="button">Uitloggen</button>
    </div>
  </aside>
  <div id="studio-overlay" class="app-overlay" hidden></div>
  <div class="app-werkvlak">
    <header class="app-werkbalk">
      <button id="studio-menu" class="secundair app-menu" type="button" aria-label="Menu openen" aria-expanded="false">Menu</button>
      <div class="app-paginakop"><span>Marketingstudio</span><h1 id="studio-titel">Overzicht</h1></div>
      <a id="studio-nieuw" class="knop" href="#maken">Nieuwe post</a>
    </header>
    <main id="studio-hoofd" class="app-inhoud">
      <div id="studio-inhoud"></div>
    </main>
  </div>
</div>
<script type="module" src="/marketing.js"></script>
</body></html>
